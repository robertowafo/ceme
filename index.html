<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicons Grâce TV -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/logo-gracetv.png" />

    <!-- Preconnect polices (perf) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" />

    <!-- Preconnect YouTube (lecteurs embarqués, vignettes, direct) -->
    <link rel="preconnect" href="https://www.youtube.com" />
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin />
    <link rel="preconnect" href="https://www.google.com" />

    <!-- Polices chargées de façon non bloquante (évite le @import CSS,
         qui retarde le premier rendu tant qu'il n'est pas résolu) -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <link rel="preload" as="style" href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@800&display=swap" />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@400;500;600;700&display=swap"
      />
      <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@800&display=swap" />
    </noscript>

    <!-- Meta par défaut (surchargées par page via le composant SEO / React 19) -->
    <title>Grâce TV (Grace TV) — Chaîne chrétienne en direct, Yaoundé</title>
    <meta name="description" content="Chaîne de télévision chrétienne basée à Yaoundé. Diffusion 24/7 de cultes, sermons, études bibliques, musique chrétienne et programmes d'évangélisation, partout." />

    <!-- Open Graph (partage WhatsApp, Facebook, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Grâce TV" />
    <meta property="og:title" content="Grâce TV — La Bonne Nouvelle Partout Partout" />
    <meta property="og:description" content="Chaîne de télévision chrétienne basée à Yaoundé. Diffusion 24/7, partout." />
    <meta property="og:image" content="https://gracetvs.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Grâce TV — La Bonne Nouvelle Partout Partout" />
    <meta name="twitter:description" content="Chaîne de télévision chrétienne basée à Yaoundé. Diffusion 24/7, partout." />
    <meta name="twitter:image" content="https://gracetvs.com/og-image.png" />
    <meta name="theme-color" content="#0f2742" />
  </head>
  <body>
    <div id="root">
      <!-- Contenu de repli lisible sans JavaScript (robots, partages, connexions lentes).
           Remplacé par l'application dès qu'elle démarre. -->
      <main style="font-family:system-ui,sans-serif;max-width:40rem;margin:3rem auto;padding:0 1rem;line-height:1.5">
        <h1>Grâce TV — La Bonne Nouvelle Partout Partout</h1>
        <p>Chaîne de télévision chrétienne basée à Yaoundé, Cameroun. Diffusion 24/7 de cultes, sermons, études bibliques, musique chrétienne et programmes d'évangélisation.</p>
        <nav aria-label="Navigation principale">
          <a href="/live">Direct</a> · <a href="/emissions">Émissions</a> · <a href="/eglise/sermons">Sermons</a> · <a href="/eglise/blog">Blog</a> · <a href="/a-propos">À propos</a> · <a href="/contact">Contact</a>
        </nav>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
