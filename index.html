<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicons Grâce TV -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/logo-gracetv.png" />

    <!-- Preconnect polices (perf) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" />

    <!-- Meta par défaut (surchargées par page via le composant SEO / React 19) -->
    <title>Grâce TV — La Bonne Nouvelle Partout Partout</title>
    <meta name="description" content="Chaîne de télévision chrétienne basée à Yaoundé. Diffusion 24/7 de cultes, sermons, études bibliques, musique chrétienne et programmes d'évangélisation, partout." />

    <!-- Open Graph (partage WhatsApp, Facebook, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Grâce TV" />
    <meta property="og:title" content="Grâce TV — La Bonne Nouvelle Partout Partout" />
    <meta property="og:description" content="Chaîne de télévision chrétienne basée à Yaoundé. Diffusion 24/7, partout." />
    <meta property="og:image" content="https://ceme-27o.pages.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Grâce TV — La Bonne Nouvelle Partout Partout" />
    <meta name="twitter:description" content="Chaîne de télévision chrétienne basée à Yaoundé. Diffusion 24/7, partout." />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
