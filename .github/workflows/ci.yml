name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Types : frontend (src/) puis Pages Functions (functions/)
      - run: npx tsc --noEmit
      - run: npx tsc -p functions/tsconfig.json --noEmit
      # Dépendances livrées en production : aucune vulnérabilité connue tolérée
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
