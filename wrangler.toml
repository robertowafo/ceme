name = "ceme"
pages_build_output_dir = "dist"
compatibility_date = "2024-11-01"

[[d1_databases]]
binding = "DB"
database_name = "ceme-db"
database_id = "9bda7f77-4ca9-41b5-b6fc-3cc2a6b681cb"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "ceme-uploads"

[vars]
BUCKET_URL = "https://pub-REMPLACER.r2.dev"

# Secrets à configurer via le dashboard Cloudflare ou :
#   wrangler secret put JWT_SECRET
#   wrangler secret put ADMIN_EMAIL
#   wrangler secret put YOUTUBE_API_KEY
